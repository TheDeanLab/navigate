# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python
name: Tests

on:
  push:
    branches:
      - develop
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
        operating-system: [windows-latest]  # [ubuntu-latest, windows-latest]
    env:
      MPLBACKEND: Agg  # https://github.com/microsoft/azure-pipelines-tasks/issues/16426
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

          # install pinned deps from the lock file (command may be `install`, `sync` or `apply` depending on uv version)
          uv pip install --lockfile uv.lock

          # install the package itself without re-resolving dependencies
          python -m pip install -e '.[dev,docs]'
      - name: Test with pytest
        run: |
          python3 -m pytest
      - name: Codecov
        uses: codecov/codecov-action@v3.1.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage/reports/
          env_vars: OS,PYTHON
          fail_ci_if_error: false
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          verbose: true
