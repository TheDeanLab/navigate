name: Validate profile guard tracing compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Guard compatibility (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: "3.10", tag: py310}
          - {os: windows-latest, python: "3.9", tag: py39}
          - {os: windows-latest, python: "3.11", tag: py311}
          - {os: ubuntu-24.04, python: "3.12", tag: py312}
    env:
      MPLBACKEND: Agg
      PYTHONPATH: src
      NAVIGATE_RUN_PLUGIN_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 4702e695dcd2c3763a48e302d5a5837f9542002e
      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libegl1 libopengl0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: constraints/windows-${{ matrix.tag }}.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints/windows-${{ matrix.tag }}.txt -e ".[dev]"
      - name: Prove the regression rejects the original audit-hook installation
        if: runner.os == 'Linux' && matrix.python == '3.10'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("test/config/test_profile_isolation.py")
          text = p.read_text()
          assert text.count("guard.install()") == 2
          p.write_text(text.replace("guard.install()", "sys.addaudithook(guard)"))
          PY
          set +e
          python -m pytest -p no:xvfb -p no:cov -o addopts= test/config/test_profile_isolation.py::test_write_guard_preserves_traced_thread_startup_and_restores_apis -q > negative-control.log 2>&1
          status=$?
          set -e
          git restore test/config/test_profile_isolation.py
          cat negative-control.log
          test "$status" -eq 1
          grep -q 'Cannot install a trace function while another trace function is being installed' negative-control.log
      - name: Focused profile, controller, and concurrency tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -p no:xvfb test/config/test_profile_isolation.py test/controller/test_controller.py test/model/concurrency --durations=10
      - name: Focused profile, controller, and concurrency tests (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest test/config/test_profile_isolation.py test/controller/test_controller.py test/model/concurrency --durations=10
      - name: Build documentation with warnings treated as errors
        if: runner.os == 'Linux' && matrix.python == '3.10'
        run: |
          python -m pip install -e ".[docs]"
          python -m sphinx -b html -W --keep-going docs/source /tmp/navigate-docs
