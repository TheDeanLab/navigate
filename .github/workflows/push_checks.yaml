name: Validate combined PRs 1276 and 1270
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Combined (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.10"
            constraints: constraints/windows-py310.txt
          - os: windows-latest
            python: "3.11"
            constraints: constraints/windows-py311.txt
    env:
      MPLBACKEND: Agg
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
      - name: Linux display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libegl1 libopengl0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.constraints }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c ${{ matrix.constraints }} -e ".[dev]"
      - name: Linux integration tests
        if: runner.os == 'Linux'
        run: timeout --signal=TERM --kill-after=10s 600s xvfb-run -a python -m pytest -p no:xvfb -p no:cov -o addopts= -o faulthandler_timeout=60 --durations=10 test/config/test_profile_isolation.py test/config/test_stage_settings.py test/controller/test_controller.py test/controller/sub_controllers/test_advanced_stage_settings.py test/controller/sub_controllers/test_stages.py test/controller/test_idle_stage_position.py test/controller/test_stop_stage_button_bindings.py test/model/devices/APIs/asi/test_asi_position_readback.py test/model/test_stage_position_monitor.py test/view/main_window_content/test_stage_tab.py test/model/concurrency
      - name: Windows integration tests
        if: runner.os == 'Windows'
        run: python -m pytest -p no:cov -o addopts= -o faulthandler_timeout=60 --durations=10 test/config/test_profile_isolation.py test/config/test_stage_settings.py test/controller/test_controller.py test/controller/sub_controllers/test_advanced_stage_settings.py test/controller/sub_controllers/test_stages.py test/controller/test_idle_stage_position.py test/controller/test_stop_stage_button_bindings.py test/model/devices/APIs/asi/test_asi_position_readback.py test/model/test_stage_position_monitor.py test/view/main_window_content/test_stage_tab.py test/model/concurrency
