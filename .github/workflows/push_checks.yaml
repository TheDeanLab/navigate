name: Diagnose remaining Python 3.10 CI stall
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    name: Bounded joins (coverage=${{ matrix.coverage }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        coverage: ["normal", "disabled"]
    env:
      MPLBACKEND: Agg
      PYTHONPATH: src
      NAVIGATE_RUN_PLUGIN_INTEGRATION: "1"
      COVERAGE_FILE: .coverage.ubuntu-24.04.py310
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ef3994c265c0fb52daf9eb8ac7280bc3c6bf5aaa
      - name: Install Linux display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libegl1 libopengl0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: constraints/windows-py310.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints/windows-py310.txt -e ".[dev]"
      - name: Cache Bio-Formats validation archive
        uses: actions/cache@v6
        with:
          path: .pytest_cache/d/bioformats
          key: ${{ runner.os }}-bioformats-${{ hashFiles('test/model/metadata_sources/bioformats.py') }}
      - name: Bound the join so pytest reports captured worker exceptions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("test/model/concurrency/test_concurrency_tools.py")
          text = p.read_text()
          old = "    for th in threads:\n        th.get_result()\n"
          new = "    for th in threads:\n        th.get_result(timeout=10)\n        assert not th.is_alive(), [(t._args, vars(t), vars(t.custody)) for t in threads if not t.is_alive() and t.custody.target_resource is not None]\n"
          assert text.count(old) == 1
          p.write_text(text.replace(old, new))
          PY
      - name: Full test order with bounded concurrency joins
        shell: bash
        run: |
          if [[ "${{ matrix.coverage }}" == "disabled" ]]; then
            timeout --signal=TERM --kill-after=10s 1800s xvfb-run -a python -m pytest -p no:xvfb --no-cov --maxfail=1 --durations=25 -o faulthandler_timeout=60
          else
            timeout --signal=TERM --kill-after=10s 1800s xvfb-run -a python -m pytest -p no:xvfb --maxfail=1 --durations=25 -o faulthandler_timeout=60
          fi
