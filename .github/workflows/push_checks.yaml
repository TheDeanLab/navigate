name: Diagnose PR 1276 Linux Python 3.10
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    name: Deterministic handoff (fixed=${{ matrix.fixed }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        fixed: [false, true]
    env:
      MPLBACKEND: Agg
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libegl1 libopengl0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: constraints/windows-py310.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints/windows-py310.txt -e ".[dev]"
      - name: Serialize the waiter's initial permission check
        if: matrix.fixed
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("src/navigate/model/concurrency/concurrency_tools.py")
          text = p.read_text()
          old = "waiting_list, _ = _get_list_and_lock(self.target_resource)"
          before = "        if self is waiting_list[0] and self.permission_slip.locked():\n            self.permission_slip.release()  # We arrived to an empty waiting list\n"
          after = "        with waiting_list_lock:\n            if self is waiting_list[0] and self.permission_slip.locked():\n                self.permission_slip.release()  # We arrived to an empty waiting list\n"
          assert text.count(old) == 1
          assert text.count(before) == 1
          p.write_text(text.replace(old, "waiting_list, waiting_list_lock = _get_list_and_lock(self.target_resource)").replace(before, after))
          PY
      - name: Deterministic handoff regression
        run: python -m pytest -p no:xvfb -p no:cov -o addopts= test/model/concurrency/test_custody_handoff.py -q
      - name: Repeat controller and concurrency tests with the fix
        if: matrix.fixed
        run: |
          for iteration in 1 2 3; do
            echo "Fixed iteration $iteration"
            timeout --signal=TERM --kill-after=10s 180s xvfb-run -a python -m pytest -p no:xvfb --durations=5 -o faulthandler_timeout=30 test/controller/test_controller.py test/model/concurrency/test_concurrency_tools.py test/model/concurrency/test_custody_handoff.py
          done
