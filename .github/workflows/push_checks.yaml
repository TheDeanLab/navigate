name: Diagnose PR 1276 Linux Python 3.10
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    name: Audit and coverage (${{ matrix.case }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: original
            audit: normal
            coverage: ""
          - case: traceable
            audit: traceable
            coverage: ""
          - case: no-coverage
            audit: normal
            coverage: "--no-cov"
          - case: no-audit-hook
            audit: skip
            coverage: ""
    env:
      MPLBACKEND: Agg
      PYTHONPATH: src
      NAVIGATE_AUDIT_DIAGNOSTIC: ${{ matrix.audit }}
      COVERAGE_FILE: .coverage.linux310.diagnostic
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libegl1 libopengl0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: constraints/windows-py310.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints/windows-py310.txt -e ".[dev]"
      - name: Focused tests without the diagnostic Python wrapper
        run: timeout --signal=TERM --kill-after=10s 180s xvfb-run -a python -m pytest -p no:xvfb ${{ matrix.coverage }} --durations=5 -o faulthandler_timeout=30 test/controller/test_controller.py test/model/concurrency/test_concurrency_tools.py
      - name: Verify profile protections remain active
        if: matrix.audit != 'skip'
        run: python -m pytest -p no:xvfb -p no:cov -o addopts= test/config/test_profile_isolation.py -q
