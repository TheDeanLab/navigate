name: Diagnose PR 1276 Linux Python 3.10

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Garbage collection ${{ matrix.collect_gui_garbage }}
    strategy:
      fail-fast: false
      matrix:
        collect_gui_garbage: ["0", "1"]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NAVIGATE_DIAGNOSTIC_GC: ${{ matrix.collect_gui_garbage }}
      NAVIGATE_DIAGNOSTIC_FORCE_WORKER_GC: "1"
      MPLBACKEND: Agg
      PYTHONPATH: src
      NAVIGATE_RUN_PLUGIN_INTEGRATION: "1"
      COVERAGE_FILE: .coverage.linux310.diagnostic
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libegl1 libopengl0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: constraints/windows-py310.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints/windows-py310.txt -e ".[dev]"
      - name: Record resolved environment
        run: python -m pip freeze --all
      - name: Cache Bio-Formats validation archive
        uses: actions/cache@v6
        with:
          path: .pytest_cache/d/bioformats
          key: ${{ runner.os }}-bioformats-${{ hashFiles('test/model/metadata_sources/bioformats.py') }}
      - name: Focused controller and concurrency reproduction
        run: timeout --signal=TERM --kill-after=15s 240s xvfb-run -a python .github/ci/pr1276_hang_probe.py -p no:xvfb --durations=5 test/controller/test_controller.py test/model/concurrency/test_concurrency_tools.py
