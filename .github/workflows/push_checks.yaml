name: Diagnose PR 1276 Linux Python 3.10
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    name: Worker startup (${{ matrix.case }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: coverage
            coverage: ""
          - case: no-coverage
            coverage: "--no-cov"
    env:
      MPLBACKEND: Agg
      PYTHONPATH: src
      COVERAGE_FILE: .coverage.linux310.diagnostic
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libegl1 libopengl0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: constraints/windows-py310.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints/windows-py310.txt -e ".[dev]"
      - name: Repeat focused order with worker metadata
        run: |
          for iteration in 1 2 3 4 5; do
            echo "Diagnostic iteration $iteration"
            timeout --signal=TERM --kill-after=10s 180s xvfb-run -a python .github/ci/pr1276_hang_probe.py -p no:xvfb ${{ matrix.coverage }} --durations=5 -o faulthandler_timeout=45 test/controller/test_controller.py test/model/concurrency/test_concurrency_tools.py
          done
