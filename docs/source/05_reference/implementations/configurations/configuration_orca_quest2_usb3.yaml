# Experimental USB3 bench profile: ORCA-Quest 2 + simulated auxiliary devices.
# Requires the Linux DCAM runtime and the HamamatsuOrcaQuest2 camera class.
# Replace the camera serial with a quoted string (preserve leading zeroes).
# Use Normal sensor mode and Software triggering; do not launch with -sh.
# Single and live capture tested; stop/restart can still produce acquisition timeout.
# PXI channel names below are inert identifiers used only by Synthetic devices.
# The 1x pixel size is sensor pitch, not a calibrated specimen-space scale.
microscopes:
  ORCA-Quest2:
    daq:
      hardware:
        name: daq
        type: Synthetic
      sample_rate: 100000
      sweep_time: 0.2
      master_trigger_out_line: PXI6259/port0/line1
      camera_trigger_out_line: /PXI6259/ctr0
      trigger_source: /PXI6259/PFI0
      laser_port_switcher: PXI6733/port0/line0
      laser_switch_state: false
    camera:
      hardware:
        type: HamamatsuOrcaQuest2
        serial_number: REPLACE_WITH_CAMERA_SERIAL
      # Linux DCAM 4.0.7087 USB restart workaround; requires only one camera.
      reinitialize_on_restart: true
      defect_correct_mode: 1.0
      settle_down: 0.0
      flip_x: false
      flip_y: false
      pixel_size_in_microns: 4.6
    remote_focus:
      hardware:
        name: daq
        type: Synthetic
        channel: PXI6259/ao2
        min: 0
        max: 5
      delay_percent: 7.5
      ramp_rising_percent: 85
      ramp_falling_percent: 2.5
      amplitude: 0.7
      offset: 2.3
      smoothing: 0.0
    galvo:
    - hardware:
        name: daq
        type: Synthetic
        channel: PXI6259/ao0
        min: -5
        max: 5
      waveform: sine
      frequency: 99.9
      amplitude: 2.5
      offset: 0.5
      duty_cycle: 50
      phase: 1.57079
    filter_wheel:
      hardware:
        name: filter_wheel
        type: Synthetic
        wheel_number: 1
      filter_wheel_delay: 0.0
      available_filters:
        Empty-Alignment: 0
    stage:
      hardware:
      - name: stage
        type: Synthetic
        serial_number: 119060508
        axes:
        - x
        - y
        - z
        - theta
        - f
        axes_mapping:
        - 1
        - 2
        - 3
        - 4
        - 5
        volts_per_micron: None
        axes_channels: None
        max: None
        min: None
      joystick_axes:
      - x
      - y
      - z
      x_max: 100000
      x_min: -100000
      y_max: 100000
      y_min: -100000
      z_max: 100000
      z_min: -100000
      f_max: 100000
      f_min: -100000
      theta_max: 360
      theta_min: 0
      x_step: 500
      y_step: 500
      z_step: 500
      theta_step: 30
      f_step: 500
      velocity: 1000
      x_offset: 0
      y_offset: 0
      z_offset: 0
      theta_offset: 0
      f_offset: 0
      flip_x: false
      flip_y: false
      flip_z: false
    zoom:
      hardware:
        type: Synthetic
        servo_id: 0
      position:
        1x: 0
      pixel_size:
        1x: 4.6
    shutter:
      hardware:
        name: daq
        type: Synthetic
        channel: PXI6259/port0/line0
        min: 0
        max: 5
    laser:
    - wavelength: 488
      onoff:
        hardware:
          name: daq
          type: Synthetic
          channel: PXI6733/port0/line2
          min: 0
          max: 5
      power:
        hardware:
          name: daq
          type: Synthetic
          channel: PXI6733/ao0
          min: 0
          max: 5
      type: Synthetic
      index: 0
      delay_percent: 10
      pulse_percent: 87
gui:
  channels:
    count: 1
    laser_power:
      min: 0
      max: 100
      step: 10
    exposure_time:
      min: 1
      max: 1000
      step: 5
    interval_time:
      min: 0
      max: 1000
      step: 5
  stack_acquisition:
    step_size:
      min: 0.1
      max: 1000
      step: 0.1
    start_pos:
      min: -5000
      max: 5000
      step: 1
    end_pos:
      min: -5000
      max: 10000
      step: 1
  timepoint:
    timepoints:
      min: 1
      max: 1000
      step: 1
    stack_pause:
      min: 0
      max: 1000
      step: 1
BDVParameters:
  shear:
    shear_data: false
    shear_dimension: YZ
    shear_angle: 45
  rotate:
    rotate_data: false
    X: 0
    Y: 0
    Z: 0
