[build-system]
requires = ["setuptools>=43.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "navigate-micro"
description = "Open source, smart, light-sheet microscopy control software."
authors = [{name = "The Dean Lab, UT Southwestern Medical Center"}]
readme = "README.md"
license-files = ["LICENSE.md"]
dynamic = ["version"]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]

requires-python = ">=3.11,<3.14"
dependencies = [
    'matplotlib-inline==0.1.3',
    'PyYAML>=6.0.2,<7',
    'pyserial==3.5',
    'PIPython==2.6.0.1',
    'nidaqmx==0.5.7',
    'tifffile',
    'scipy',
    'pyusb==1.2.1',
    'pandas',
    'pandastable==0.12.2.post1',
    'opencv-python',
    'numpy; sys_platform != "darwin"',
    'numpy; sys_platform == "darwin"',
    'scikit-image',
    'zarr>=3.1.1,<4',
    'fsspec; sys_platform != "darwin"',
    'fsspec; sys_platform == "darwin"',
    'h5py',
    'requests',
    'psutil==6.0.0',
    'ome-zarr-models>=1.6',
    ]

[project.scripts]
navigate = "navigate.main:main"

[project.optional-dependencies]
photometrics = [
    "PyVCAM"
    ]

dev = [
    "pytest",
    "pytest-xvfb",
    "pytest-cov",
    "pre-commit",
    "pytest-rerunfailures",
    "ipykernel",
    "jupyterlab",
    "ome-zarr",
    "bioio-ome-zarr"
    ]

docs = [
    "numpydoc",
    "nbconvert",
    "sphinx<6.0.0",
    "sphinx_rtd_theme",
    "sphinx-copybutton",
    "sphinx-issues",
    "sphinx-design",
    "pyyaml",
    "pydata_sphinx_theme==0.10.0rc2",
    "sphinx-toolbox",
    "mss",
    "codespell"
]

robot = [
    "mecademicpy",
]

[project.urls]
Source = "https://github.com/TheDeanLab/navigate"

[tool.setuptools.dynamic]
version = {file = "src/navigate/VERSION"}
