theme:
  preset: classic_night
  ttk_base_theme: clam
  palette:
    window_bg: "#11161d"
    panel_bg: "#1a212b"
    surface_bg: "#202938"
    input_bg: "#121923"
    border: "#2f3a4a"
    text: "#d7dee8"
    muted_text: "#9aa8bb"
    accent: "#4b78b8"
    accent_hover: "#5a88c9"
    accent_pressed: "#3f679d"
    danger: "#b84a4a"
    success: "#4f8a5b"
    tooltip_description_bg: "#283243"
    tooltip_error_bg: "#b84a4a"
    tooltip_text: "#d7dee8"
  typography:
    caption: ["TkDefaultFont", 9]
    body: ["TkDefaultFont", 10]
    body_bold: ["TkDefaultFont", 10, "bold"]
    section: ["TkDefaultFont", 12, "bold"]
    title: ["TkDefaultFont", 14, "bold"]
    title_italic: ["TkDefaultFont", 14, "italic"]
    button: ["TkDefaultFont", 10]
    button_emphasis: ["TkDefaultFont", 12, "bold"]
    tooltip: ["TkDefaultFont", 9]
    tooltip_emphasis: ["TkDefaultFont", 9, "bold"]

channel_settings:
  count: 5
  laser_power:
    step: 1
    min: 0
    max: 100
  exposure_time:
    step: 1
    min: 1
    max: 1000
  interval:
    step: 1
    min: 1
    max: 10
  defocus:
    step: 1
    min: 0
    max: 100
stack_acquisition:
  step_size:
    step: 0.01
    min: 0.01
    max: 1000
  z_start_pos:
    step: 1.0
    min: -10000
    max: 10000
  z_end_pos:
    step: 1.0
    min: -10000
    max: 10000
  f_start_pos:
    step: 0.01
    min: -200
    max: 2000
  f_end_pos:
    step: 0.01
    min: -200
    max: 200
time:
  stack_pause:
    step: 0.1
    min: 0
    max: 1000
  timepoints:
    step: 1
    min: 1
    max: 5000
