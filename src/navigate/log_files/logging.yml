%YAML 1.2
---
version: 1
disable_existing_loggers: False

formatters:
  base:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(module)s: %(message)s'
  json:
    format: '%(message)s'

filters:
  performance_specs:
    (): ext://navigate.log_files.filters.PerformanceFilter
  not_performance:
    (): ext://navigate.log_files.filters.NonPerfFilter

handlers:
  console:
    class: logging.StreamHandler
    level: WARNING
    formatter: base
    stream: ext://sys.stdout
    filters: [not_performance]
  info:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: base
    filename: info.log
    filters: [not_performance]
    mode: a
  debug:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: base
    filename: debug.log
    filters: [not_performance]
    mode: a
  performance:
    class: logging.handlers.RotatingFileHandler
    level: PERFORMANCE
    formatter: json
    filename: performance.log
    filters: [ performance_specs ]
    mode: a

loggers:
  view:
    level: DEBUG
    handlers: [console, info, debug, performance]
    propagate: no
  controller:
    level: DEBUG
    handlers: [console, info, debug, performance]
    propagate: no
  config:
    level: DEBUG
    handlers: [console, info, debug, performance]
    propagate: no
  model:
    level: DEBUG
    handlers: [console, info, debug, performance]
    propagate: no